name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 打 tag 发版 ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl 目标是全静态链接，扔到任何 Linux 都能跑，不挑 glibc 版本。
          # rustls 依赖的 ring 是 C 代码，musl 目标需要 musl-gcc。
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # ARM 用原生 ARM runner 编译，避免交叉编译 aarch64-musl 的工具链折腾。
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 装 musl 工具链
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 重命名
        run: |
          cp target/${{ matrix.target }}/release/heybot \
             heybot-${{ github.ref_name }}-${{ matrix.target }}
          chmod +x heybot-${{ github.ref_name }}-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: heybot-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: 创建 Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      # deploy/ 目录要一起发出去，得先把代码拉下来。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 附上部署脚本
        run: |
          mkdir -p dist/deploy
          cp -r deploy/* dist/deploy/

      - name: 生成校验和
        working-directory: dist
        run: sha256sum heybot-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/heybot-*
            dist/SHA256SUMS
            dist/deploy/*
          generate_release_notes: true
