[package]
name = "heybot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "小黑盒社区 @ 自动回复机器人：拉取被 @ 的消息，交给大模型生成评价并回帖"
license = "MIT"
readme = "README.md"
repository = "https://github.com/IQZZ020501/hey-bot"
homepage = "https://github.com/IQZZ020501/hey-bot"
documentation = "https://docs.rs/heybot"
keywords = ["xiaheihe", "bot", "automation", "chatbot"]
categories = ["command-line-utilities", "api-bindings"]

[lib]
name = "heybot"
path = "src/lib.rs"

[[bin]]
name = "heybot"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", features = [
    "json",
    "rustls",
    "webpki-roots",
    "cookies",
    "multipart",
    "form",
    "query",
    "gzip",
    "charset",
    "http2",
], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
regex = "1"
rand = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14", features = ["svg"] }
dotenvy = "0.15"
dirs = "6"
async-trait = "0.1.92"

[profile.release]
strip = true
lto = "thin"
